name: kanji_kr
description: "한국인을 위한 일본어 한자 학습 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  http: ^1.1.0

dev_dependencies:
  flutter_lints: ^3.0.0
  test: ^1.25.2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/lists.json
    - assets/data/kanji/
    - assets/data/word/
